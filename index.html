<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management System</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: "Segoe UI", sans-serif;
            color: #1c2833;
            background: #eef3f8;
        }
        h1 {
            margin: 32px 20px 18px;
            text-align: center;
            color: #1f4e79;
            font-size: 32px;
        }
        #root {
            max-width: 980px;
            margin: 0 auto 48px;
            padding: 0 20px;
        }
        #catch {
            grid-column: 1 / -1;
            justify-self: end;
            height: 42px;
            margin-top: 4px;
            padding: 0 28px;
            border: none;
            border-radius: 8px;
            background: #2b619e;
            color: #fff;
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }
        #catch:hover { background: #1f4e79; }
        form {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 14px;
            padding: 20px;
            background: #fff;
            border: 1px solid #d9e2ec;
            border-radius: 16px;
        }
        form label {
            display: flex;
            flex-direction: column;
            gap: 6px;
            font-size: 14px;
            font-weight: 600;
            color: #35506b;
        }
        select {
            width: 100%;
            height: 42px;
            padding: 8px 12px;
            background: #fbfcfe;
            border: 1px solid #c5d2e0;
            border-radius: 8px;
            font: inherit;
            color: #1c2833;
        }
        .table-wrap {
            margin-top: 18px;
            overflow: hidden;
            background: #fff;
            border: 1px solid #d9e2ec;
            border-radius: 16px;
        }
        table {
            width: 100%;
            table-layout: fixed;
            border-collapse: collapse;
        }
        #black { background: #1f4e79; color: #fff; }
        th, td {
            padding: 12px 10px;
            text-align: left;
            font-size: 14px;
            overflow-wrap: anywhere;
        }
        th:nth-child(1), td:nth-child(1) { width: 52px; }
        th:nth-child(3), td:nth-child(3) { width: 18%; }
        th:nth-child(4), td:nth-child(4) { width: 22%; }
        th:nth-child(5), td:nth-child(5) { width: 18%; }
        td { border-top: 1px solid #e6edf4; }
        tbody tr:nth-child(even) { background: #f7fafc; }
        #empty {
            margin: 14px 2px 0;
            color: #5c6b7a;
        }
        #pager {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            align-items: center;
            justify-content: center;
            margin-top: 14px;
        }
        #pager button {
            min-width: 40px;
            height: 36px;
            padding: 0 12px;
            border: 1px solid #c5d2e0;
            border-radius: 8px;
            background: #fff;
            color: #1f4e79;
            font: inherit;
            cursor: pointer;
        }
        #pager button[disabled] {
            color: #9aa8b5;
            cursor: default;
        }
        #pager button.current {
            background: #1f4e79;
            border-color: #1f4e79;
            color: #fff;
        }
        @media (max-width: 700px) {
            h1 { font-size: 24px; }
            form { grid-template-columns: 1fr; }
            th, td { padding: 10px 6px; font-size: 13px; }
            th:nth-child(1), td:nth-child(1) { width: 42px; }
            #catch { justify-self: stretch; }
        }
    </style>
</head>
<body>
    <div id="root">
        <h1>Employee Management System</h1>
        <form>
            <label>Filter by Department
                <select id="department">
                    <option value="selectDepartment">--Select by Department--</option>
                    <option value="Operations">Operations</option>
                    <option value="HR">HR</option>
                    <option value="Finance">Finance</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Marketing">Marketing</option>
                </select>
            </label>
            <label>Filter by Gender
                <select id="gender">
                    <option value="">All</option>
                    <option value="Female">Female</option>
                    <option value="Male">Male</option>
                    <option value="Others">Others</option>
                </select>
            </label>
            <label>Sort by Salary
                <select id="salary">
                    <option value="Low">Low to High</option>
                    <option value="High">High to Low</option>
                </select>
            </label>
            <button id="catch" type="button">Fetch</button>
        </form>
        <p id="empty">Click Fetch to load the employees.</p>
        <div class="table-wrap">
            <table id="table">
                <thead id="black">
                    <tr>
                        <th>S.No</th>
                        <th>Name</th>
                        <th>Gender</th>
                        <th>Department</th>
                        <th>Salary</th>
                    </tr>
                </thead>
                <tbody id="dataAppend"></tbody>
            </table>
        </div>
        <div id="pager"></div>
    </div>
    <script>
        let employees = []
        let page = 1
        let pageSize = 10
        let department = document.getElementById("department")
        let gender = document.getElementById("gender")
        let salary = document.getElementById("salary")
        let dataAppend = document.getElementById("dataAppend")
        let empty = document.getElementById("empty")
        let pager = document.getElementById("pager")
        let button = document.getElementById("catch")

        button.addEventListener("click", async function () {
            let data = await fetch("https://dbioz2ek0e.execute-api.ap-south-1.amazonaws.com/mockapi/get-employees")
            let response = await data.json()
            employees = response.data
            showRows()
        })

        department.addEventListener("change", showRows)
        gender.addEventListener("change", showRows)
        salary.addEventListener("change", showRows)

        function showRows() {
            page = 1
            renderPage()
        }

        function renderPage() {
            let list = employees.filter(function (person) {
                let departmentMatch = department.value === "selectDepartment" || person.department.toLowerCase() === department.value.toLowerCase()
                let genderMatch = gender.value === "" || person.gender.toLowerCase() === gender.value.toLowerCase()
                return departmentMatch && genderMatch
            })
            list.sort(function (a, b) {
                if (salary.value === "High") {
                    return b.salary - a.salary
                }
                return a.salary - b.salary
            })
            let pageCount = Math.ceil(list.length / pageSize)
            if (page > pageCount) {
                page = pageCount || 1
            }
            let start = (page - 1) * pageSize
            let visible = list.slice(start, start + pageSize)
            dataAppend.innerHTML = ""
            visible.forEach(function (person, index) {
                let row = document.createElement("tr")
                let values = [start + index + 1, person.name, titleCase(person.gender), titleCase(person.department), person.salary]
                values.forEach(function (value) {
                    let cell = document.createElement("td")
                    cell.textContent = value
                    row.appendChild(cell)
                })
                dataAppend.appendChild(row)
            })
            if (employees.length === 0) {
                empty.textContent = "Click Fetch to load the employees."
            } else if (list.length === 0) {
                empty.textContent = "No employees match these filters."
            } else {
                empty.textContent = "Showing " + (start + 1) + "-" + (start + visible.length) + " of " + list.length
            }
            renderPager(pageCount)
        }

        function renderPager(pageCount) {
            pager.innerHTML = ""
            if (pageCount < 2) {
                return
            }
            pager.appendChild(pageButton("Previous", page === 1, function () {
                page -= 1
                renderPage()
            }))
            for (let number = 1; number <= pageCount; number++) {
                let pageNumber = pageButton(String(number), false, function () {
                    page = number
                    renderPage()
                })
                if (number === page) {
                    pageNumber.classList.add("current")
                }
                pager.appendChild(pageNumber)
            }
            pager.appendChild(pageButton("Next", page === pageCount, function () {
                page += 1
                renderPage()
            }))
        }

        function pageButton(label, disabled, onClick) {
            let control = document.createElement("button")
            control.type = "button"
            control.textContent = label
            control.disabled = disabled
            control.addEventListener("click", onClick)
            return control
        }

        function titleCase(value) {
            if (!value) {
                return ""
            }
            return value.charAt(0).toUpperCase() + value.slice(1)
        }
    </script>
</body>
</html>
